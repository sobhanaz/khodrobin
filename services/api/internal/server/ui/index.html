<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خودروبین — ترب برای خودروی دست‌دوم</title>
<meta name="description" content="جست‌وجوی خودروی دست‌دوم در دیوار، باما و همراه‌مکانیک. یک خودرو، همه‌ی آگهی‌ها، یک قیمت میانه.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080b; --bg-2:#0b0d12; --surface:#11141c; --surface-2:#161a24;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --glass:rgba(255,255,255,.045); --blur:18px;
  --ink:#f4f6fa; --ink-2:#a4adbe; --ink-3:#6b7488;
  --accent:#ff2e4d; --accent-dim:rgba(255,46,77,.12);
  --good:#3ddc84; --good-dim:rgba(61,220,132,.12);
  --warn:#ffb02e; --warn-dim:rgba(255,176,46,.12);
  --bad:#ff5c5c;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --r:16px; --r-sm:10px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Vazirmatn,"IRANSansX","IRANSans",Tahoma,system-ui,sans-serif;
  font-weight:400;line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* Depth without images: two soft radial washes and a faint grid. */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(60rem 40rem at 85% -10%,rgba(255,46,77,.10),transparent 60%),
    radial-gradient(50rem 35rem at 10% 5%,rgba(61,220,132,.055),transparent 60%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),
                   linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(70rem 50rem at 50% 0%,#000 20%,transparent 78%);
}
a{color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* ---------- chrome: glass is for chrome only, never behind data ---------- */
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(var(--blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%)}

header{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line);
  background:rgba(7,8,11,.72);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%)}
.bar{display:flex;align-items:center;gap:14px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.06rem;letter-spacing:-.01em}
.dot{width:9px;height:9px;border-radius:99px;background:var(--accent);box-shadow:0 0 0 4px var(--accent-dim);animation:pulse 2.6s var(--ease) infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--accent-dim)}50%{box-shadow:0 0 0 9px transparent}}
.tag{font-family:var(--mono);font-size:.66rem;color:var(--ink-3);border:1px solid var(--line);padding:3px 8px;border-radius:99px;letter-spacing:.04em}
.spacer{flex:1}
.head-stat{font-family:var(--mono);font-size:.72rem;color:var(--ink-3)}
.head-stat b{color:var(--good);font-weight:500}

/* ---------- hero ---------- */
.hero{padding:64px 0 26px;text-align:center}
.kicker{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.7rem;color:var(--accent);
  border:1px solid rgba(255,46,77,.28);background:var(--accent-dim);padding:5px 12px;border-radius:99px;letter-spacing:.05em}
h1{font-size:clamp(2rem,5.5vw,3.4rem);line-height:1.22;margin:20px 0 12px;font-weight:900;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--accent)}
.sub{color:var(--ink-2);font-size:1.02rem;max-width:52ch;margin:0 auto}

/* ---------- search ---------- */
.searchwrap{margin:30px auto 0;max-width:720px}
.searchbox{display:flex;align-items:center;gap:12px;padding:6px 6px 6px 6px;border-radius:var(--r);
  border:1px solid var(--line-2);background:var(--surface);
  transition:border-color .25s var(--ease),box-shadow .25s var(--ease),transform .25s var(--ease)}
.searchbox:focus-within{border-color:rgba(255,46,77,.55);box-shadow:0 0 0 4px var(--accent-dim),0 16px 44px -20px rgba(0,0,0,.9);transform:translateY(-1px)}
.searchbox input{flex:1;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:1rem;padding:13px 14px}
.searchbox input::placeholder{color:var(--ink-3)}
.go{border:0;border-radius:var(--r-sm);background:var(--accent);color:#fff;font:inherit;font-weight:700;
  padding:12px 22px;cursor:pointer;transition:filter .2s var(--ease),transform .12s var(--ease)}
.go:hover{filter:brightness(1.12)} .go:active{transform:scale(.97)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{font-size:.8rem;color:var(--ink-2);border:1px solid var(--line);background:var(--glass);
  padding:6px 13px;border-radius:99px;cursor:pointer;transition:all .2s var(--ease)}
.chip:hover{color:var(--ink);border-color:var(--line-2);transform:translateY(-2px)}

/* ---------- understood-intent row ---------- */
.intent{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:22px auto 0;max-width:820px;justify-content:center;min-height:32px}
.ichip{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;padding:5px 11px;border-radius:99px;
  border:1px solid rgba(61,220,132,.3);background:var(--good-dim);color:var(--good);
  animation:pop .38s var(--ease) both}
.ichip .k{color:var(--ink-3);font-family:var(--mono);font-size:.66rem}
.ichip button{all:unset;cursor:pointer;color:var(--ink-3);font-size:.9rem;line-height:1;padding:0 1px}
.ichip button:hover{color:var(--bad)}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.94)}to{opacity:1;transform:none}}

/* ---------- mode tabs ---------- */
.modes{display:flex;gap:4px;padding:5px;border-radius:99px;width:max-content;margin:26px auto 0;
  border:1px solid var(--line);background:var(--glass);position:relative}
.mode{position:relative;z-index:1;border:0;background:none;color:var(--ink-3);font:inherit;font-size:.84rem;
  padding:8px 18px;border-radius:99px;cursor:pointer;transition:color .22s var(--ease);white-space:nowrap}
.mode[aria-selected=true]{color:#fff}
.pill{position:absolute;z-index:0;top:5px;bottom:5px;border-radius:99px;background:var(--accent);
  transition:right .38s var(--ease),width .38s var(--ease)}

/* ---------- results ---------- */
.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:34px 0 14px;flex-wrap:wrap}
.count{color:var(--ink-2);font-size:.88rem}
.count b{color:var(--ink)}
.timing{font-family:var(--mono);font-size:.7rem;color:var(--ink-3)}

.cards{display:grid;gap:12px}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;
  transition:border-color .25s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease);
  animation:rise .5s var(--ease) both}
.card:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:0 18px 44px -28px #000}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.row{display:grid;grid-template-columns:1fr auto;gap:16px;padding:17px 19px;align-items:start}
.title{font-weight:700;font-size:1.06rem;letter-spacing:-.01em}
.facts{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.fact{font-size:.74rem;color:var(--ink-2);border:1px solid var(--line);border-radius:7px;padding:3px 9px;background:var(--surface-2)}
.fact.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.badges{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.src{font-size:.7rem;padding:3px 9px;border-radius:99px;border:1px solid var(--line-2);color:var(--ink-2);background:var(--surface-2)}
.src.on{color:var(--good);border-color:rgba(61,220,132,.32);background:var(--good-dim)}

.price{text-align:left;direction:ltr;min-width:170px}
.price .n{font-family:var(--mono);font-size:1.34rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.price .u{font-size:.72rem;color:var(--ink-3);margin-inline-start:4px;font-family:Vazirmatn,sans-serif}
.price .lbl{font-size:.68rem;color:var(--ink-3);font-family:Vazirmatn,sans-serif;direction:rtl}

/* price spread bar: the distribution *is* the product */
.spread{padding:0 19px 15px}
.track{position:relative;height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.fill{position:absolute;inset-block:0;background:linear-gradient(90deg,var(--good),var(--warn),var(--accent));border-radius:99px;
  transform-origin:right center;animation:grow .7s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ends{display:flex;justify-content:space-between;margin-top:6px;font-family:var(--mono);font-size:.68rem;color:var(--ink-3)}

.acts{display:flex;gap:8px;padding:0 19px 15px;flex-wrap:wrap}
.act{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);font:inherit;font-size:.78rem;
  padding:7px 14px;border-radius:99px;cursor:pointer;transition:all .2s var(--ease)}
.act:hover{color:var(--ink);border-color:var(--line-2)}
.act[aria-expanded=true]{color:var(--accent);border-color:rgba(255,46,77,.35);background:var(--accent-dim)}

.drawer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .42s var(--ease)}
.drawer.open{grid-template-rows:1fr}
.drawer>div{overflow:hidden}
.inner{border-top:1px solid var(--line);padding:16px 19px;background:var(--bg-2)}

.offer{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line)}
.offer:last-child{border-bottom:0}
.offer .t{font-size:.86rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.offer .p{font-family:var(--mono);font-size:.94rem;font-variant-numeric:tabular-nums;direction:ltr;text-align:left}
.delta{font-family:var(--mono);font-size:.72rem;padding:2px 7px;border-radius:6px;direction:ltr}
.delta.lo{color:var(--good);background:var(--good-dim)} .delta.hi{color:var(--accent);background:var(--accent-dim)}
.flag{display:flex;gap:7px;align-items:flex-start;font-size:.78rem;color:var(--warn);background:var(--warn-dim);
  border:1px solid rgba(255,176,46,.22);border-radius:9px;padding:8px 11px;margin-top:8px}

.bars{display:grid;gap:8px;margin-top:4px}
.bar{display:grid;grid-template-columns:88px 1fr 46px;gap:10px;align-items:center;font-size:.76rem}
.bar .lab{color:var(--ink-3)}
.bar .tr{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar .fl{height:100%;border-radius:99px;background:var(--accent);transform-origin:right center;animation:grow .6s var(--ease) both}
.bar .v{font-family:var(--mono);font-size:.72rem;color:var(--ink-2);text-align:left;direction:ltr}
.sec{font-family:var(--mono);font-size:.68rem;color:var(--ink-3);letter-spacing:.05em;margin:14px 0 8px;text-transform:uppercase}
.sec:first-child{margin-top:0}
.raw{font-family:var(--mono);font-size:.72rem;color:var(--ink-3);direction:ltr;text-align:left;
  background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;overflow-x:auto;white-space:pre}

.empty{text-align:center;padding:56px 20px;color:var(--ink-3)}
.skel{height:104px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface),var(--surface-2),var(--surface));
  background-size:200% 100%;animation:sheen 1.3s linear infinite}
@keyframes sheen{to{background-position:-200% 0}}

footer{margin:56px 0 40px;padding-top:22px;border-top:1px solid var(--line);
  display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;color:var(--ink-3);font-size:.78rem}
footer .mono{color:var(--ink-2)}

@media (max-width:640px){
  .row{grid-template-columns:1fr}
  .price{text-align:right;direction:rtl;min-width:0}
  .price .n{direction:ltr;display:inline-block}
  .modes{width:100%;overflow-x:auto;justify-content:flex-start}
  .bar{grid-template-columns:74px 1fr 42px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (prefers-reduced-transparency:reduce){
  .glass,header{background:var(--surface);backdrop-filter:none;-webkit-backdrop-filter:none}
}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <div class="brand"><span class="dot"></span>خودروبین</div>
    <span class="tag">torob for used cars</span>
    <span class="spacer"></span>
    <span class="head-stat" id="headStat"></span>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <span class="kicker">crawl → normalize → rank → explain</span>
    <h1>یک خودرو، <em>همه‌ی آگهی‌ها</em>،<br>یک قیمت واقعی.</h1>
    <p class="sub">آگهی‌های دیوار، باما و همراه‌مکانیک را کنار هم می‌گذاریم، واحدها و مدل‌ها را یکسان می‌کنیم، و میانه‌ی واقعی بازار را نشان می‌دهیم.</p>

    <div class="searchwrap">
      <form class="searchbox" id="form" role="search">
        <input id="q" name="q" type="search" autocomplete="off"
               placeholder="مثلاً: ارزون‌ترین پژو ۲۰۶ بالای مدل ۹۵ زیر ۵۰۰ میلیون"
               aria-label="جست‌وجوی خودرو">
        <button class="go" type="submit">جست‌وجو</button>
      </form>
      <div class="chips" id="examples"></div>
      <div class="intent" id="intent" aria-live="polite"></div>
    </div>

    <div class="modes" id="modes" role="tablist">
      <span class="pill" id="pill"></span>
    </div>
  </section>

  <section>
    <div class="meta">
      <div class="count" id="count"></div>
      <div class="timing" id="timing"></div>
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <footer>
    <div>خودروبین — ساخته‌شده برای چالش AI Product Engineer ترب</div>
    <div class="mono" id="foot"></div>
  </footer>
</main>

<script>
const $ = s => document.querySelector(s);
const FA = n => new Intl.NumberFormat('fa-IR').format(n);
const LTR = n => new Intl.NumberFormat('en-US').format(n);

const MODES = [
  ['relevant','مرتبط‌ترین'],
  ['cheapest','ارزان‌ترین'],
  ['lowkm','کم‌کارکردترین'],
  ['value','بهترین ارزش'],
];
const EXAMPLES = [
  'ارزون‌ترین پژو ۲۰۶ بالای مدل ۹۵',
  'پراید مدل ۹۸',
  'کوییک دنده‌ای',
  'سمند سورن زیر ۲ میلیارد',
  'پژو ۲۰۷ اتوماتیک',
];

let mode = 'relevant';
let lastQuery = '';

/* ---------- mode tabs with a sliding indicator ---------- */
const modesEl = $('#modes'), pill = $('#pill');
MODES.forEach(([id,label])=>{
  const b = document.createElement('button');
  b.className='mode'; b.type='button'; b.role='tab'; b.dataset.id=id; b.textContent=label;
  b.setAttribute('aria-selected', id===mode);
  b.onclick = ()=>{ mode=id; syncTabs(); run(lastQuery); };
  modesEl.appendChild(b);
});
function syncTabs(){
  const btns=[...modesEl.querySelectorAll('.mode')];
  btns.forEach(b=>b.setAttribute('aria-selected', b.dataset.id===mode));
  const on=btns.find(b=>b.dataset.id===mode); if(!on) return;
  // RTL: position the pill from the right edge of the container.
  pill.style.width = on.offsetWidth+'px';
  pill.style.right = (modesEl.offsetWidth - on.offsetLeft - on.offsetWidth)+'px';
}
addEventListener('resize', syncTabs);

EXAMPLES.forEach(t=>{
  const c=document.createElement('button');
  c.className='chip'; c.type='button'; c.textContent=t;
  c.onclick=()=>{ $('#q').value=t; run(t); };
  $('#examples').appendChild(c);
});

$('#form').addEventListener('submit', e=>{ e.preventDefault(); run($('#q').value); });

/* ---------- intent chips: show what the machine understood ---------- */
function renderIntent(intent){
  const el=$('#intent'); el.innerHTML='';
  const parts=[];
  if(intent.brand_fa) parts.push(['برند',intent.brand_fa,'brand']);
  if(intent.model_fa) parts.push(['مدل',intent.model_fa,'model']);
  if(intent.year_min) parts.push(['از سال',FA(intent.year_min),'year_min']);
  if(intent.year_max && intent.year_max!==intent.year_min) parts.push(['تا سال',FA(intent.year_max),'year_max']);
  if(intent.price_max) parts.push(['حداکثر',FA(Math.round(intent.price_max/1e6))+' م','price_max']);
  if(intent.price_min) parts.push(['حداقل',FA(Math.round(intent.price_min/1e6))+' م','price_min']);
  if(intent.gearbox) parts.push(['گیربکس',intent.gearbox==='at'?'اتوماتیک':'دنده‌ای','gearbox']);
  parts.forEach(([k,v],i)=>{
    const s=document.createElement('span'); s.className='ichip'; s.style.animationDelay=(i*45)+'ms';
    s.innerHTML=`<span class="k">${k}</span><span>${v}</span>`;
    el.appendChild(s);
  });
}

const money = n => `<span class="n">${LTR(n)}</span><span class="u">تومان</span>`;

function offerRow(o){
  const cls = o.vs_median_pct < 0 ? 'lo' : 'hi';
  const sign = o.vs_median_pct > 0 ? '+' : '';
  const km = o.mileage_km==null ? '—' : LTR(o.mileage_km)+' km';
  return `<div class="offer">
      <span class="src on">${o.source_fa}</span>
      <span class="t"><a href="${o.url}" target="_blank" rel="noopener noreferrer">${o.title||'—'}</a>
        <span style="color:var(--ink-3);font-size:.76rem"> · ${km}${o.city?' · '+o.city:''}</span></span>
      <span><span class="p">${LTR(o.price)}</span> <span class="delta ${cls}">${sign}${o.vs_median_pct}%</span></span>
    </div>` + (o.flags||[]).map(f=>`<div class="flag">⚑<span>${f.message}</span></div>`).join('');
}

function backstage(s){
  const b=s.breakdown||{};
  const labels={price:'قیمت',mileage:'کارکرد',age:'سال ساخت',corroborate:'تأیید چندمنبعی',integrity:'سلامت داده'};
  const max=Math.max(...Object.values(b),0.001);
  const bars=Object.entries(b).sort((a,c)=>c[1]-a[1]).map(([k,v],i)=>`
    <div class="bar"><span class="lab">${labels[k]||k}</span>
      <span class="tr"><span class="fl" style="width:${(v/max*100).toFixed(1)}%;animation-delay:${i*60}ms"></span></span>
      <span class="v">${v.toFixed(3)}</span></div>`).join('');
  const raw=s.offers.map(o=>`${o.source.padEnd(7)} brand=${o.raw_brand??'-'} model=${o.raw_model??'-'} trim=${o.raw_trim??'-'}`).join('\n');
  return `<div class="sec">امتیاز رتبه‌بندی — مجموع ${s.score.toFixed(3)}</div><div class="bars">${bars}</div>
    <div class="sec">کلید یکسان‌سازی</div><div class="raw">${s.key}</div>
    <div class="sec">آنچه هر منبع گفته بود</div><div class="raw">${raw}</div>`;
}

function card(s,i){
  const el=document.createElement('article');
  el.className='card'; el.style.animationDelay=Math.min(i*45,400)+'ms';
  const trim = s.trim ? ` · ${s.trim}` : '';
  const gb = s.gearbox_fa ? ` · ${s.gearbox_fa}` : '';
  const km = s.km_bucket==null ? '' : `<span class="fact n">${LTR(s.km_bucket*25)}–${LTR((s.km_bucket+1)*25)} هزار کیلومتر</span>`;
  const srcs=new Set(s.offers.map(o=>o.source_fa));
  const badges=['دیوار','باما','همراه‌مکانیک'].map(n=>`<span class="src${srcs.has(n)?' on':''}">${n}</span>`).join('');
  const spreadPct = s.max_price>s.min_price ? 100 : 60;

  el.innerHTML=`
    <div class="row">
      <div>
        <div class="title">${s.brand_fa} ${s.model_fa}${trim} — مدل ${FA(s.year)}${gb}</div>
        <div class="facts">
          <span class="fact n">${FA(s.offer_count)} آگهی</span>
          <span class="fact n">${FA(s.source_count)} منبع</span>
          ${km}
          ${s.flag_count?`<span class="fact" style="color:var(--warn)">${FA(s.flag_count)} تناقض</span>`:''}
        </div>
        <div class="badges">${badges}</div>
      </div>
      <div class="price">
        <div class="lbl">میانه‌ی بازار</div>
        <div>${money(s.median_price)}</div>
      </div>
    </div>
    <div class="spread">
      <div class="track"><span class="fill" style="width:${spreadPct}%;animation-delay:${Math.min(i*45,400)+120}ms"></span></div>
      <div class="ends"><span>${LTR(s.min_price)}</span><span>${LTR(s.max_price)}</span></div>
    </div>
    <div class="acts">
      <button class="act" type="button" aria-expanded="false" data-t="offers">${FA(s.offer_count)} آگهی</button>
      <button class="act" type="button" aria-expanded="false" data-t="back">پشت صحنه</button>
    </div>
    <div class="drawer"><div><div class="inner"></div></div></div>`;

  const drawer=el.querySelector('.drawer'), inner=el.querySelector('.inner');
  let open=null;
  el.querySelectorAll('.act').forEach(btn=>{
    btn.onclick=()=>{
      const t=btn.dataset.t;
      if(open===t){ drawer.classList.remove('open'); btn.setAttribute('aria-expanded','false'); open=null; return; }
      el.querySelectorAll('.act').forEach(b=>b.setAttribute('aria-expanded','false'));
      btn.setAttribute('aria-expanded','true');
      inner.innerHTML = t==='offers' ? s.offers.map(offerRow).join('') : backstage(s);
      drawer.classList.add('open'); open=t;
    };
  });
  return el;
}

async function run(q){
  lastQuery=q||'';
  const cards=$('#cards');
  cards.innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  try{
    const r=await fetch(`/api/v1/search?q=${encodeURIComponent(lastQuery)}&mode=${mode}&limit=24`);
    const d=await r.json();
    const res=d.result;
    renderIntent(res.intent);
    $('#count').innerHTML = res.total
      ? `<b>${FA(res.total)}</b> خودرو پیدا شد`
      : 'چیزی پیدا نشد';
    $('#timing').textContent = `parse ${d.timing.parse_ms.toFixed(2)}ms · rank ${d.timing.rank_ms.toFixed(2)}ms · ${res.mode}`;
    cards.innerHTML='';
    if(!res.specs.length){
      cards.innerHTML='<div class="empty">برای این جست‌وجو آگهی‌ای نداریم. یکی از نمونه‌های بالا را امتحان کن.</div>';
      return;
    }
    res.specs.forEach((s,i)=>cards.appendChild(card(s,i)));
  }catch(e){
    cards.innerHTML='<div class="empty">ارتباط با سرور برقرار نشد.</div>';
  }
}

async function boot(){
  syncTabs();
  try{
    const s=await (await fetch('/api/v1/stats')).json();
    const st=s.stats;
    $('#headStat').innerHTML=`<b>${LTR(st.indexed)}</b> آگهی · <b>${LTR(st.specs)}</b> خودرو · <b>${LTR(st.multi_source_specs)}</b> چندمنبعی`;
    $('#foot').textContent=`built ${new Date(s.built_at).toISOString().slice(0,16).replace('T',' ')}Z · ${st.sources.join(' · ')}`;
  }catch(e){}
  run('');
}
boot();
</script>
