name: khodrobin

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAINS: ${DOMAINS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    restart: unless-stopped

  web:
    image: ghcr.io/${GHCR_OWNER}/khodrobin-web:${TAG:-latest}
    environment:
      # Server-side rendering talks to the Go service directly over the compose
      # network; the browser calls the same origin and Caddy routes it.
      NUXT_API_BASE: http://api:8080
      NUXT_PUBLIC_API_BASE: ""
    expose:
      - "3000"
    depends_on: [api]
    restart: unless-stopped

  api:
    image: ghcr.io/${GHCR_OWNER}/khodrobin-api:${TAG:-latest}
    environment:
      KHODROBIN_ADDR: ":8080"
    volumes:
      # Read-only: the API observes the index, the crawler owns it.
      - indexdata:/data:ro
    expose:
      - "8080"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  crawler:
    image: ghcr.io/${GHCR_OWNER}/khodrobin-crawler:${TAG:-latest}
    environment:
      CRAWL_INTERVAL_SECONDS: ${CRAWL_INTERVAL_SECONDS:-10800}
      CRAWL_CITIES: ${CRAWL_CITIES:-tehran mashhad isfahan shiraz tabriz}
      CRAWL_PAGES: ${CRAWL_PAGES:-30}
    volumes:
      - indexdata:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: khodrobin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: khodrobin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khodrobin"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  indexdata:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
