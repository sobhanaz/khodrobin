name: deploy

# Everything ships from GitHub: build here, publish to GHCR, then the server
# only ever pulls. Nothing is built or edited on the box by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/khodrobin-api

jobs:
  build:
    name: build and publish
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy to production
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Load SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync deployment files
        run: |
          scp -i ~/.ssh/id_ed25519 docker-compose.prod.yml Caddyfile \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/khodrobin/"

      - name: Pull and restart
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<SCRIPT
          set -euo pipefail
          cd /opt/khodrobin
          cat > .env <<ENVFILE
          DOMAINS=${{ secrets.DEPLOY_DOMAIN }}
          GHCR_OWNER=${{ github.repository_owner }}
          TAG=${TAG}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          SELLER_HASH_SALT=${{ secrets.SELLER_HASH_SALT }}
          ENVFILE
          chmod 600 .env
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f
          SCRIPT

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              "https://$(echo '${{ secrets.DEPLOY_DOMAIN }}' | awk '{print $1}')/healthz" || true)
            if [ "$code" = "200" ]; then
              echo "live: https://$(echo '${{ secrets.DEPLOY_DOMAIN }}' | awk '{print $1}')/healthz"
              exit 0
            fi
            echo "attempt $i: http=$code"; sleep 6
          done
          echo "::error::deployment did not become healthy"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cd /opt/khodrobin && docker compose -f docker-compose.prod.yml ps && docker compose -f docker-compose.prod.yml logs --tail=40'
          exit 1
