name: deploy

# Everything ships from GitHub: build here, publish to GHCR, then the server
# only ever pulls. Nothing is built or edited on the box by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/khodrobin-api
  CRAWLER_IMAGE: ghcr.io/${{ github.repository_owner }}/khodrobin-crawler
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/khodrobin-web
  AI_IMAGE: ghcr.io/${{ github.repository_owner }}/khodrobin-ai

jobs:
  build:
    name: build and publish
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build search index from the seed snapshot
        run: |
          pip install -q -r services/crawler/requirements.txt
          python services/crawler/build_index.py \
            --raw data/seed/listings.seed.jsonl \
            --out services/api/data/index.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: api image
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: web image
        uses: docker/build-push-action@v6
        with:
          context: ./services/web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: ai image
        uses: docker/build-push-action@v6
        with:
          context: ./services/ai
          push: true
          tags: |
            ${{ env.AI_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.AI_IMAGE }}:latest
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

      - name: crawler image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/crawler/Dockerfile
          push: true
          tags: |
            ${{ env.CRAWLER_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.CRAWLER_IMAGE }}:latest
          cache-from: type=gha,scope=crawler
          cache-to: type=gha,mode=max,scope=crawler

  deploy:
    name: deploy to production
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Load SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync deployment files
        run: |
          scp -i ~/.ssh/id_ed25519 docker-compose.prod.yml Caddyfile \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/khodrobin/"

      - name: Pull and restart
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<SCRIPT
          set -euo pipefail
          cd /opt/khodrobin
          cat > .env <<ENVFILE
          DOMAINS=${{ secrets.DEPLOY_DOMAIN }}
          GHCR_OWNER=${{ github.repository_owner }}
          TAG=${TAG}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          SELLER_HASH_SALT=${{ secrets.SELLER_HASH_SALT }}
          ENVFILE
          chmod 600 .env
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          # The Caddyfile is bind-mounted, so editing it does not change the
          # container spec and compose will not recreate Caddy. Without an
          # explicit reload, routing changes are silently ignored — which is
          # exactly how a new front end kept serving the old one.
          docker compose -f docker-compose.prod.yml exec -T caddy \
            caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile \
            || docker compose -f docker-compose.prod.yml restart caddy
          docker image prune -f
          SCRIPT

      # Probe what a visitor actually opens, not a constant.
      #
      # This used to curl /healthz alone, which returned a hardcoded 200 and so
      # asserted that the process was running — not that it could answer. A
      # broken front end, an empty index or a stale one all passed.
      - name: Smoke test
        run: |
          HOST=$(echo '${{ secrets.DEPLOY_DOMAIN }}' | awk '{print $1}')
          for i in $(seq 1 30); do
            ready=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$HOST/readyz" || true)
            home=$(curl -s --max-time 15 "https://$HOST/" || true)
            search=$(curl -s --max-time 15 "https://$HOST/api/v1/search?q=%D9%BE%DA%98%D9%88&limit=1" || true)

            home_ok=$(printf '%s' "$home" | grep -c 'خودروبین' || true)
            hits=$(printf '%s' "$search" | python3 -c 'import json,sys;print(json.load(sys.stdin)["result"]["total"])' 2>/dev/null || echo 0)

            if [ "$ready" = "200" ] && [ "$home_ok" -ge 1 ] && [ "$hits" -gt 0 ]; then
              echo "live: https://$HOST — readyz 200, homepage rendered, search returned $hits specs"
              exit 0
            fi
            echo "attempt $i: readyz=$ready homepage_match=$home_ok search_hits=$hits"
            sleep 6
          done
          echo "::error::deployment did not become healthy"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cd /opt/khodrobin && docker compose -f docker-compose.prod.yml ps && docker compose -f docker-compose.prod.yml logs --tail=40'
          exit 1
