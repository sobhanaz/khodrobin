name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: api (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12' 
      - name: gofmt
        working-directory: services/api
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        working-directory: services/api
        run: go vet ./...
      - name: test
        working-directory: services/api
        run: go test -race -cover ./...
      - name: Build search index (the API embeds it, so CI must build it too)
        run: |
          pip install -q -r services/crawler/requirements.txt
          python services/crawler/build_index.py \
            --raw data/seed/listings.seed.jsonl \
            --out services/api/data/index.json
      - name: build
        working-directory: services/api
        run: go build ./...

  crawler:
    name: crawler (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/crawler/requirements.txt
      - name: install
        working-directory: services/crawler
        run: pip install -r requirements.txt pytest
      - name: test
        working-directory: services/crawler
        run: python -m pytest -q

  caddy:
    name: caddyfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A malformed Caddyfile took production down once: Caddy crash-looped
      # while every other container reported healthy, so nothing failed except
      # the smoke test at the very end. Validate it before it can ship.
      - name: validate
        run: |
          docker run --rm \
            -e DOMAINS="example.com" \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  web:
    name: web (nuxt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: services/web/pnpm-lock.yaml
      - name: install
        working-directory: services/web
        run: pnpm install --frozen-lockfile
      - name: build
        working-directory: services/web
        run: pnpm run build
