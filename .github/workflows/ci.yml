name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: api (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: api/go.sum
      - name: gofmt
        working-directory: api
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        working-directory: api
        run: go vet ./...
      - name: test
        working-directory: api
        run: go test -race -cover ./...
      - name: build
        working-directory: api
        run: go build ./...

  crawler:
    name: crawler (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - name: install
        working-directory: crawler
        run: pip install -r requirements.txt pytest
      - name: test
        working-directory: crawler
        run: python -m pytest -q

  caddy:
    name: caddyfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A malformed Caddyfile took production down once: Caddy crash-looped
      # while every other container reported healthy, so nothing failed except
      # the smoke test at the very end. Validate it before it can ship.
      - name: validate
        run: |
          docker run --rm \
            -e DOMAINS="example.com" \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
