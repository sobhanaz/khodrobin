name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: api (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: api/go.sum
      - name: gofmt
        working-directory: api
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        working-directory: api
        run: go vet ./...
      - name: test
        working-directory: api
        run: go test -race -cover ./...
      - name: build
        working-directory: api
        run: go build ./...
